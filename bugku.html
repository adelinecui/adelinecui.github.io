---
layout: home
title: Bugku Writeup合集
---
<div class="container">
<h1>Bugku 全部文章</h1>
<ul>
{% for post in site.posts %}
{% if post.categories contains "bugku" %}
<li> 
  <a href="{{ post.url }} ">{{ post.title }}</a >
  <span style="color:#777; margin-left:15px;">{{ post.date | date:"%Y-%m-%d" }}</span>
</li>
{% endif %}
{% endfor %}
</ul>
<div style="text-align:center;margin:40px 0;">
    <a href="{{ site.baseurl }}/" style="display:inline-block;background-color:#7998f5;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-size:18px;">返回主页</a>
</div>

</div>
