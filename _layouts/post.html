---
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<!-- 只有这一处顶部横幅，下面不再放图片 -->
<div style="width:100%;height:300px;margin:0;padding:0;">
<img src="/banner.jpg" style="width:100%;height:100%;object-fit:cover;margin:0;padding:0;display:block;" alt="banner">
</div>

<!-- 取消上边距，文字紧贴上面的banner -->
<div class="container" style="margin-top:0 !important;padding-top:0 !important;">
<h1 style="margin-top:0;padding-top:8px;">{{ page.title }}</h1>
<p>{{ page.date }}</p >
{{ content }}
{% if page.categories contains "ctfhub" %}
<div style="text-align:center;margin:40px 0;">
    <a href="{{ site.baseurl }}/ctfhub.html" style="display:inline-block;background-color:#7998f5;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-size:18px;">返回CTFHub总库</a>
</div>
{% endif %}

</div>

</body>
</html>
