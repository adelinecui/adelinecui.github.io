<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div style="width:100%;height:300px;margin:0;padding:0;">
< img src="/banner.jpg" style="width:100%;height:100%;object-fit:cover;margin:0;padding:0;" alt="banner">
</div>

<div class="container">
<h2>分类</h2>
<p>CTF</p >

<h2>帖子列表</h2>
{% for post in site.posts %}
<div class="post-item">
  <a href=" ">
    <h2>{{ post.title }}</h2>
  </a >
  <p class="post-date">{{ post.date }}</p >
</div>
{% endfor %}
</div>
</body>
</html>
